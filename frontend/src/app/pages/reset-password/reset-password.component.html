<section class="reset-page">
  <form class="reset-card" (ngSubmit)="reset()">
    <div class="reset-heading">
      <span>Gestor de permisos laborales</span>
      <h1>Cambiar contraseña</h1>
      <p>El enlace caduca a los 5 minutos.</p>
    </div>

    <label>
      Nueva contraseña
      <input name="password" type="password" [(ngModel)]="password" autocomplete="new-password" required>
    </label>

    <label>
      Confirmar contraseña
      <input name="confirmarPassword" type="password" [(ngModel)]="confirmarPassword" autocomplete="new-password" required>
    </label>

    <button type="submit" [disabled]="loading || !password || !confirmarPassword">
      {{ loading ? "Guardando..." : "Cambiar contraseña" }}
    </button>

    <p class="success" *ngIf="success">{{ success }}</p>
    <p class="error" *ngIf="error">{{ error }}</p>

    <a routerLink="/login">Volver al login</a>
  </form>
</section>
